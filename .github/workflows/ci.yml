name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/**"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/pia/requirements.txt
      - run: cd backend/pia && pytest
